<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Perfil</title>
    <!-- MDB icon -->
    <link rel="icon" href="../img/mdb-favicon.ico" type="image/x-icon" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- Google Fonts Roboto -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
    />
    <!-- MDB -->
    <link rel="stylesheet" href="../css/mdb.min.css">
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body class="mainbody appbody">
    <header id="site-navigation"></header>
    <div class="app-shell">
      <aside class="sidebar">
        <h5 class="sidebar-brand">ADAPTIVE<br>RL COACH</h5>
        <a href="plan.html" class="sidebar-link">Plan</a>
        <a href="replays.html" class="sidebar-link">Replays</a>
        <a href="analisis.html" class="sidebar-link">Análisis</a>
        <a href="objetivos.html" class="sidebar-link">Objetivos</a>
        <a href="sesiones.html" class="sidebar-link">Sesiones</a>
        <a href="perfil.html" class="sidebar-link active" aria-current="page">Perfil</a>
        <a href="helpme.html" class="sidebar-link">Ayuda</a>
        <div class="sidebar-footer">
          <button type="button" id="cerrar-sesion" class="btn-rl btn-rl-outline w-100" data-session-logout>Cerrar sesión</button>
        </div>
      </aside>
      <main class="app-main">
        <h1 class="fw-bold text-light mb-4">Perfil y configuración inicial</h1>
        <form id="form-perfil">
          <div class="row">
            <div class="col-6"><div data-mdb-input-init class="form-outline bodycolor mb-4">
              <input type="text" id="nombre" class="form-control" autocomplete="name" />
              <label class="form-label" for="nombre">Nombre visible</label>
            </div></div>
            <div class="col-6"><div data-mdb-input-init class="form-outline bodycolor mb-4">
              <select id="plataforma" class="form-select" required><option value="">Selecciona una plataforma</option><option value="steam">Steam</option><option value="epic">Epic Games</option></select>
              <label class="form-label" for="plataforma">Plataforma</label>
            </div></div>
          </div>
          <div class="row">
            <div class="col-6"><div data-mdb-input-init class="form-outline bodycolor mb-4">
              <input type="text" id="idplat" class="form-control" autocomplete="off" required />
              <label class="form-label" for="idplat">Identificador de plataforma</label>
            </div></div>
            <div class="col-6"><div data-mdb-input-init class="form-outline bodycolor mb-4">
              <select id="modalidad" class="form-select" required><option value="">Selecciona modalidad</option><option value="1v1">1v1</option><option value="2v2">2v2</option><option value="3v3">3v3</option></select>
              <label class="form-label" for="modalidad">Modalidad principal</label>
            </div></div>
          </div>
          <div class="row">
            <div class="col-6"><div data-mdb-input-init class="form-outline bodycolor mb-4">
              <input type="number" id="minutos" class="form-control" min="1" max="240" />
              <label class="form-label" for="minutos">Minutos por sesión</label>
            </div></div>
            <div class="col-6"><div data-mdb-input-init class="form-outline bodycolor mb-4">
              <input type="number" id="dias" class="form-control" min="1" max="7" />
              <label class="form-label" for="dias">Días disponibles por semana</label>
            </div></div>
          </div>
          <div class="row">
            <div class="col-6"><div data-mdb-input-init class="form-outline bodycolor mb-4">
              <input type="text" id="rango" class="form-control" />
              <label class="form-label" for="rango">Rango declarado y temporada</label>
            </div></div>
            <div class="col-6"><div data-mdb-input-init class="form-outline bodycolor mb-4">
              <input type="date" id="fecha" class="form-control" />
              <label class="form-label" for="fecha">Fecha del registro</label>
            </div></div>
          </div>
          <div class="row">
            <div class="col-12"><div data-mdb-input-init class="form-outline bodycolor mb-4">
              <input type="text" id="enfoque" class="form-control" />
              <label class="form-label" for="enfoque">Enfoque inicial: prepara una sugerencia en Objetivos</label>
            </div></div>
          </div>
          <div class="row mt-2">
            <div class="col-8">
              <div class="card bg-card border-card denotative pb-4 h-100">
              <div class="card-body">
                <h5 class="card-title fw-bold text-light mb-2">Fuente y seguimiento</h5>
                <ul class="card-text text-bray fs-6 list-unstyled mb-0">
                <li id="fuente-rango">El rango es opcional y declarado por el jugador.</li>
                <li>El enfoque aún necesita una meta medible.</li>
                </ul>
              </div>
            </div>
            </div>
            <div class="col-4">
              <button type="submit" id="guardar-perfil" class="btn-rl btn-rl-accent w-100 mb-3">Guardar perfil</button>
              <button type="button" class="btn-rl btn-rl-outline w-100 mb-3" data-mdb-ripple-init data-mdb-ripple-color="info">Definir objetivo</button>
              <button type="button" class="btn-rl btn-rl-outline w-100" data-mdb-ripple-init data-mdb-ripple-color="info">Cancelar</button>
            </div>
          </div>
        </form>
        <p id="perfil-estado" class="app-note" role="status" aria-live="polite">Cargando perfil…</p>
      </main>
    </div>

    <!-- MDB -->
    <script src="../../vendor/jquery-3.7.1.min.js"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/session-client.js"></script>
    <script src="../js/navigation.js"></script>
    <script type="text/javascript" src="../js/mdb.umd.min.js"></script>
    <!-- Custom scripts -->
    <script src="../js/profile.js"></script>
  </body>
</html>
