<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Registro e inicio de sesión | Adaptive RL Coach</title>
    <!-- MDB icon -->
    <link rel="icon" href="../img/mdb-favicon.ico" type="image/x-icon" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- Google Fonts Roboto -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
    />
    <!-- MDB -->
    <link rel="stylesheet" href="../css/mdb.min.css">
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body class="mainbody">
    <header id="site-navigation"></header>
    <!-- Start your project here-->
    <div class="container">
      <div class="row mb-4">
        <div class="col-12">
          <h1 class="fw-bold text-light mb-4">Registro e inicio de sesión</h1>
        </div>
      </div>
      <div class="row mb-4">
        <div class="col-12 w-50 d-block mx-auto bg-card p-4 rounded-4 border-card">
            <form id="registro">
                <h4 class="text-light fw-bold mb-3">Crear cuenta</h4>
                <button type="button" id="google-registro" class="mx-auto d-block w-75 p-2 accent rounded-4 border-0 fw-bold mb-2" data-mdb-ripple-init data-mdb-ripple-color="light"> Continuar con Google </button>

                <p class="text-bray fw-light fs-6 text-center">O utiliza tu correo</p>
                
                 <div data-mdb-input-init class="form-outline bodycolor">
                <input type="text" id="Nombre" class="form-control mb-4" autocomplete="name" required />
                <label class="form-label" for="Nombre">Nombre</label>
                 </div>

                <div data-mdb-input-init class="form-outline mb-4 bodycolor">
                <input type="email" id="Correo" class="form-control" autocomplete="email" required />
                <label class="form-label" for="Correo">Correo</label>
                </div>

                <div class="row mb-4">
                    <div class="col-6">
                        <div data-mdb-input-init class="form-outline mb-4 bodycolor">
                <input type="password" id="contraseña" class=" form-control" autocomplete="new-password" minlength="8" required />
                <label class="form-label" for="contraseña">Contraseña</label>
                </div>
                    </div>
                <div class="col-6">
                    <div data-mdb-input-init class="form-outline mb-4 bodycolor">
                <input type="password" id="confirm" class=" form-control" autocomplete="new-password" minlength="8" required />
                <label class="form-label" for="confirm">Confirmación</label>
                </div>
                </div>
                </div>

                <button type="submit" class="mb-2 mx-auto d-block w-75 p-2 accent rounded-4 border-0 fw-bold">Crear cuenta</button>
                <p id="registro-estado" class="text-bray fw-light text-center" role="status" aria-live="polite">Configura Supabase para habilitar el acceso.</p>
                <p class="text-accent fw-light text-center"><a href="#inicio-sesion" class="text-accent">Ya tienes cuenta? Inicia sesión</a></p>
                <div class="d-flex justify-content-center gap-3">
                <a href="helpme.html" class="text-bray fw-light ">Recuperar contraseña</a>
                <a href="index.html" class=" text-bray fw-light">Volver a inicio</a>
                </div> 
            </form>
            <hr class="border-secondary my-4">
            <form id="inicio-sesion">
                <h4 class="text-light fw-bold mb-3">Iniciar sesión</h4>
                <div data-mdb-input-init class="form-outline mb-4 bodycolor">
                  <input type="email" id="login-correo" class="form-control" />
                  <label class="form-label" for="login-correo">Correo</label>
                </div>
                <div data-mdb-input-init class="form-outline mb-4 bodycolor">
                  <input type="password" id="login-contrasena" class="form-control" />
                  <label class="form-label" for="login-contrasena">Contraseña</label>
                </div>
                <button type="submit" class="mx-auto d-block w-75 p-2 bodycolor border-accent rounded-4 fw-bold text-light">Iniciar sesión</button>
                <button type="button" id="google-login" class="mx-auto d-block w-75 p-2 bodycolor border-accent rounded-4 fw-bold text-light mt-2">Iniciar con Google</button>
                <p id="login-estado" class="text-bray fw-light text-center mt-3" role="status" aria-live="polite">Configura Supabase para habilitar el acceso.</p>
            </form>
        </div>
        </div>
      </div>
    </div>
    <!-- End your project here-->

    <!-- MDB -->
    <script type="text/javascript" src="../js/mdb.umd.min.js"></script>
    <!-- Custom scripts -->
    <script src="../../vendor/jquery-3.7.1.min.js"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/session-client.js"></script>
    <script src="../js/navigation.js"></script> 
    <script src="../js/auth.js"></script>
  </body>
</html>
